[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "pathology-slide-agent"
version = "0.1.0"
description = "Reproducible pathology slide analysis and agent workflow for research"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.34,<1", "python-multipart>=0.0.20,<1", "numpy>=2,<3", "pillow>=11,<13", "httpx>=0.28,<1", "python-dotenv>=1,<2"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.11,<1"]
wsi = ["openslide-python>=1.4,<2", "openslide-bin>=4,<5"]
ml = ["torch>=2.6,<3"]
foundation = ["torch>=2.6,<3", "transformers==4.57.6", "safetensors>=0.6,<1"]
integration = ["tifffile>=2025.1"]

[tool.setuptools.packages.find]
include = ["pathology*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
